name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Read pinned kernel revision
        id: normein
        run: echo "commit=$(sed -n 's/^normeinCommit=//p' normein-build.lock)" >> "$GITHUB_OUTPUT"
      # Normein is currently private. This dedicated deploy key grants read-only access to that
      # repository; credentials are removed by checkout and never enter Gradle caches/artifacts.
      - name: Checkout pinned Normein kernel
        uses: actions/checkout@v4
        with:
          repository: 6234456/normein
          ref: ${{ steps.normein.outputs.commit }}
          path: .deps/normein
          ssh-key: ${{ secrets.NORMEIN_DEPLOY_KEY }}
          persist-credentials: false
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: workbench-ui/package-lock.json
      - name: Frontend dependencies
        working-directory: workbench-ui
        run: npm ci
      - name: Quality gates, JVM tests and application rendering
        run: ./gradlew --no-daemon check :mantra-cli:installDist
      - name: All CLI commands
        run: scripts/smoke-cli.sh
      - name: Independent demonstration calculations
        run: |
          python3 apps/de-est/verify_expected.py --verify-values apps/de-est/build/out/case-mustermann-values.json
          python3 apps/de-est/verify_expected.py --year 2026 --verify-values apps/de-est/build/out/case-mustermann-params-2026-values.json
          python3 apps/de-est/verify_expected.py --verify-tax-free apps/de-est/build/out/case-single-tax-free-values.json
          python3 apps/de-est/verify_expected.py --verify-tax-free apps/de-est/build/out/case-single-tax-free-params-2026-values.json
          python3 apps/ifrs-impairment/verify_expected.py --verify apps/ifrs-impairment/build/out/case-demo-values.json
          python3 apps/ifrs-impairment/verify_expected.py --case custom-weight --verify apps/ifrs-impairment/build/out/case-custom-weight-values.json
          python3 apps/ifrs-impairment/verify_expected.py --case no-impairment --verify apps/ifrs-impairment/build/out/case-no-impairment-values.json
          python3 apps/cost-accounting/verify_expected.py --verify apps/cost-accounting/build/out/case-demo-values.json
          python3 apps/cost-accounting/verify_expected.py --zero-pools --verify apps/cost-accounting/build/out/case-zero-pools-values.json
          python3 apps/ifrs-impairment/verify_expected.py --scale 2 --verify apps/ifrs-impairment/build/out/case-demo-cent-precision-values.json
          python3 apps/ifrs-impairment/verify_expected.py --case custom-weight --scale 2 --verify apps/ifrs-impairment/build/out/case-custom-weight-cent-precision-values.json
          python3 apps/ifrs-impairment/verify_expected.py --case no-impairment --scale 2 --verify apps/ifrs-impairment/build/out/case-no-impairment-cent-precision-values.json
          python3 apps/cost-accounting/verify_expected.py --unit-scale 6 --verify apps/cost-accounting/build/out/case-demo-unit-precision-values.json
          python3 apps/cost-accounting/verify_expected.py --zero-pools --unit-scale 6 --verify apps/cost-accounting/build/out/case-zero-pools-unit-precision-values.json
          python3 apps/ifrs-income-taxes/verify_expected.py --verify apps/ifrs-income-taxes/build/out/case-demo-values.json
          python3 apps/ifrs-income-taxes/verify_expected.py --verify apps/ifrs-income-taxes/build/out/case-demo-precision-values.json
          python3 apps/ifrs-income-taxes/verify_expected.py --case loss --verify apps/ifrs-income-taxes/build/out/case-loss-values.json
          python3 apps/ifrs-income-taxes/verify_expected.py --case loss --verify apps/ifrs-income-taxes/build/out/case-loss-precision-values.json
          python3 apps/ifrs-income-taxes/verify_expected.py --case zero-profit --verify apps/ifrs-income-taxes/build/out/case-zero-profit-values.json
          python3 apps/ifrs-income-taxes/verify_expected.py --case zero-profit --verify apps/ifrs-income-taxes/build/out/case-zero-profit-precision-values.json
          python3 apps/ifrs-income-taxes/verify_expected.py --case unreconciled --verify apps/ifrs-income-taxes/build/out/case-unreconciled-values.json
          python3 apps/ifrs-income-taxes/verify_expected.py --case unreconciled --verify apps/ifrs-income-taxes/build/out/case-unreconciled-precision-values.json
          python3 apps/ifrs-impairment/verify_expected.py --case discounted-viu --scale 0 --verify apps/ifrs-impairment/build/out/case-discounted-viu-values.json
          python3 apps/ifrs-impairment/verify_expected.py --case discounted-viu --scale 2 --verify apps/ifrs-impairment/build/out/case-discounted-viu-cent-precision-values.json
          python3 apps/ifrs-impairment/verify_expected.py --case capped --scale 0 --verify apps/ifrs-impairment/build/out/case-capped-values.json
          python3 apps/ifrs-impairment/verify_expected.py --case capped --scale 2 --verify apps/ifrs-impairment/build/out/case-capped-cent-precision-values.json
          python3 apps/ifrs-impairment/verify_expected.py --case insufficient-capacity --scale 0 --verify apps/ifrs-impairment/build/out/case-insufficient-capacity-values.json
          python3 apps/ifrs-impairment/verify_expected.py --case insufficient-capacity --scale 2 --verify apps/ifrs-impairment/build/out/case-insufficient-capacity-cent-precision-values.json
          python3 apps/fixed-assets/verify_expected.py --self-test
          python3 apps/fixed-assets/verify_expected.py --case demo --scale 2 --verify apps/fixed-assets/build/out/case-demo-values.json
          python3 apps/fixed-assets/verify_expected.py --case demo --scale 4 --verify apps/fixed-assets/build/out/case-demo-precision-values.json
          python3 apps/fixed-assets/verify_expected.py --case unreconciled --scale 2 --verify apps/fixed-assets/build/out/case-unreconciled-values.json
          python3 apps/fixed-assets/verify_expected.py --case unreconciled --scale 4 --verify apps/fixed-assets/build/out/case-unreconciled-precision-values.json
          python3 apps/fixed-assets/verify_expected.py --case partial-year --scale 2 --verify apps/fixed-assets/build/out/case-partial-year-values.json
          python3 apps/fixed-assets/verify_expected.py --case partial-year --scale 4 --verify apps/fixed-assets/build/out/case-partial-year-precision-values.json
          python3 apps/fixed-assets/verify_expected.py --case rounding-residue --scale 2 --verify apps/fixed-assets/build/out/case-rounding-residue-values.json
          python3 apps/fixed-assets/verify_expected.py --case rounding-residue --scale 4 --verify apps/fixed-assets/build/out/case-rounding-residue-precision-values.json
          python3 apps/fixed-assets/verify_expected.py --case fully-depreciated --scale 2 --verify apps/fixed-assets/build/out/case-fully-depreciated-values.json
          python3 apps/fixed-assets/verify_expected.py --case fully-depreciated --scale 4 --verify apps/fixed-assets/build/out/case-fully-depreciated-precision-values.json
          python3 apps/fixed-assets/verify_expected.py --case residual-floor --scale 2 --verify apps/fixed-assets/build/out/case-residual-floor-values.json
          python3 apps/fixed-assets/verify_expected.py --case residual-floor --scale 4 --verify apps/fixed-assets/build/out/case-residual-floor-precision-values.json
          python3 apps/ifrs-leases/verify_expected.py --self-test
          python3 apps/ifrs-leases/verify_expected.py --case demo --scale 2 --verify apps/ifrs-leases/build/out/case-demo-values.json
          python3 apps/ifrs-leases/verify_expected.py --case demo --scale 4 --verify apps/ifrs-leases/build/out/case-demo-precision-values.json
          python3 apps/ifrs-leases/verify_expected.py --case unreconciled --scale 2 --verify apps/ifrs-leases/build/out/case-unreconciled-values.json
          python3 apps/ifrs-leases/verify_expected.py --case unreconciled --scale 4 --verify apps/ifrs-leases/build/out/case-unreconciled-precision-values.json
          python3 apps/ifrs-leases/verify_expected.py --case single-period --scale 2 --verify apps/ifrs-leases/build/out/case-single-period-values.json
          python3 apps/ifrs-leases/verify_expected.py --case single-period --scale 4 --verify apps/ifrs-leases/build/out/case-single-period-precision-values.json
          python3 apps/ifrs-leases/verify_expected.py --case commencement-payment --scale 2 --verify apps/ifrs-leases/build/out/case-commencement-payment-values.json
          python3 apps/ifrs-leases/verify_expected.py --case commencement-payment --scale 4 --verify apps/ifrs-leases/build/out/case-commencement-payment-precision-values.json
          python3 apps/ifrs-leases/verify_expected.py --case negative-payment --scale 2 --verify apps/ifrs-leases/build/out/case-negative-payment-values.json
          python3 apps/ifrs-leases/verify_expected.py --case negative-payment --scale 4 --verify apps/ifrs-leases/build/out/case-negative-payment-precision-values.json
          python3 apps/ifrs-leases/verify_expected.py --case negative-rate-outside-demo --scale 2 --verify apps/ifrs-leases/build/out/case-negative-rate-outside-demo-values.json
          python3 apps/ifrs-leases/verify_expected.py --case negative-rate-outside-demo --scale 4 --verify apps/ifrs-leases/build/out/case-negative-rate-outside-demo-precision-values.json
      # Independent M3 facts are checked against actual graph-based application outputs.
      - name: Independent linked and bounded-iteration demonstrations
        run: |
          python3 apps/de-est/verify_m3_expected.py --outputs apps/de-est/build/out
          python3 apps/de-gewst/verify_m3_expected.py --outputs apps/de-gewst/build/out
          python3 apps/circular-calculation/verify_m3_expected.py --outputs apps/circular-calculation/build/out
      - name: Frontend tests
        working-directory: workbench-ui
        run: npm test
      - name: Frontend build
        working-directory: workbench-ui
        run: npm run build
      - name: Browser flows using the runner's installed Chrome
        working-directory: workbench-ui
        env:
          MANTRA_TEST_CHROME: /usr/bin/google-chrome
        run: npm run test:e2e
      - name: Test reports and demonstration papers
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: verification-results
          path: |
            mantra-*/build/reports/tests/
            apps/*/build/reports/tests/
            apps/*/build/out/
            benchmarks/build/reports/tests/
          if-no-files-found: ignore
